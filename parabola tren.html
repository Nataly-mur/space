<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Парабола: знаки a, c, D</title>
<style>
  :root{
    --bg:#f5f3ee; --card:#fff; --ink:#244167; --muted:#6b7280;
    --line:#e5e7eb; --ok:#16a34a; --err:#8A282F; --gold:#C08A2F;
  }
    .formula-top{
    text-align:center;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 20px;
    color: #555;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 system-ui,Arial,sans-serif;
       background:var(--bg);color:var(--ink);padding:20px}
  .app{max-width:700px;margin:0 auto;background:var(--card);
       border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.12);
       padding:20px;overflow:hidden}
  h1{font-size:22px;margin:0 0 6px;text-align:center}
  p.sub{color:var(--muted);font-size:14px;margin:0 0 16px;text-align:center}

  .stage{background:#fafafa;border-radius:12px;padding:6px;margin-bottom:14px;
         overflow-x:auto;-webkit-overflow-scrolling:touch}
  svg{display:block;margin:0 auto;max-width:100%}

  .question{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
  .qrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
        background:#f8f9fb;padding:10px 12px;border-radius:10px}
  .qlabel{font-weight:700;font-size:17px;min-width:80px}
  .qlabel.a{color:#d32f2f}
  .qlabel.c{color:#1565c0}
  .qlabel.d{color:#2e7d32}
  .opts{display:flex;gap:6px;flex:1;flex-wrap:wrap}
  .opt{padding:8px 14px;border:2px solid var(--line);background:#fff;
       border-radius:8px;cursor:pointer;font-weight:600;font-size:15px;
       color:var(--ink);user-select:none}
  .opt:hover{background:#f3f4f6}
  .opt.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
  .opt.correct{background:#ecfdf3;border-color:var(--ok);color:var(--ok)}
  .opt.wrong{background:#fef2f2;border-color:var(--err);color:var(--err)}

  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  button.main{flex:1 1 140px;padding:12px 16px;border:none;border-radius:10px;
    font-size:16px;font-weight:700;cursor:pointer;color:#fff;background:var(--gold)}
  button.main:hover{opacity:.9}
  button.main:disabled{opacity:.5;cursor:not-allowed}
  button.main.answer{background:#16a34a}
  button.main.answer:hover{background:#15803d}

  #result{min-height:26px;font-size:16px;font-weight:700;text-align:center;
          margin-bottom:10px}
  #result.ok{color:var(--ok)}
  #result.err{color:var(--err)}
  #result .eq{
    display: inline-block;
    margin-top: 6px;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 18px;
    color: #555;
  }
  .stats{display:flex;justify-content:space-around;gap:10px;flex-wrap:wrap;
         background:#f8f9fb;padding:12px;border-radius:10px;
         font-weight:700;font-size:14px}
  .stats .reached{color:var(--gold)}

  .back-btn{position:fixed;bottom:15px;right:15px;width:44px;height:44px;
    background:#0066cc;color:#fff;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;font-size:20px;z-index:999}
  .back-btn:hover{background:#0052a3}

  @media (max-width:600px){
    body{padding:10px}
    .app{padding:14px;border-radius:12px}
    h1{font-size:19px}
    .qrow{padding:10px}
    .qlabel{font-size:16px;min-width:60px}
    .opt{padding:9px 12px;font-size:15px}
    button.main{font-size:16px;padding:13px 14px}
  }
</style>
</head>
<body>
<a href="index.html" class="back-btn">&#8592;</a>
<div class="app">
  <h1>Парабола: знаки a, c, D</h1>
  <p class="sub">Посмотрите на график и определите знак каждого коэффициента</p>
    <div class="formula-top">
    y = ax² + bx + c
  </div>
  <div class="stage">
    <svg id="board" viewBox="0 0 400 340" width="400">
      <rect width="400" height="340" fill="#fafafa" rx="8"/>
      <!-- Сетка без подписей -->
      <g stroke="#ececec" stroke-width="1" id="grid"></g>
      <!-- Оси -->
      <line id="xaxis" x1="10" y1="220" x2="395" y2="220" stroke="#333" stroke-width="2"/>
      <line id="yaxis" x1="200" y1="10" x2="200" y2="335" stroke="#333" stroke-width="2"/>
      <polygon points="390,215 398,220 390,225" fill="#333"/>
      <polygon points="195,10 200,4 205,10" fill="#333"/>
      <text x="375" y="240" font-family="Arial" font-size="16" fill="#333" font-weight="bold">x</text>
      <text x="208" y="18" font-family="Arial" font-size="16" fill="#333" font-weight="bold">y</text>
      <!-- Парабола -->
      <path id="curve" fill="none" stroke="#d32f2f" stroke-width="3.5"/>
      <!-- Точка на оси Oy -->
      <circle id="ptC" cx="200" cy="220" r="5" fill="#1565c0"/>
    </svg>
  </div>

  <div class="question">
    <div class="qrow">
      <div class="qlabel a">a</div>
      <div class="opts" data-key="a">
        <div class="opt" data-val="pos">&gt; 0</div>
        <div class="opt" data-val="zero">= 0</div>
        <div class="opt" data-val="neg">&lt; 0</div>
      </div>
    </div>
    <div class="qrow">
      <div class="qlabel c">c</div>
      <div class="opts" data-key="c">
        <div class="opt" data-val="pos">&gt; 0</div>
        <div class="opt" data-val="zero">= 0</div>
        <div class="opt" data-val="neg">&lt; 0</div>
      </div>
    </div>
    <div class="qrow">
      <div class="qlabel d">D</div>
      <div class="opts" data-key="D">
        <div class="opt" data-val="pos">&gt; 0</div>
        <div class="opt" data-val="zero">= 0</div>
        <div class="opt" data-val="neg">&lt; 0</div>
      </div>
    </div>
  </div>

  <div class="btns">
    <button class="main answer" id="btnAnswer">Ответить</button>
    <button class="main" id="btnNew">Новое задание</button>
  </div>

  <div id="result"></div>

  <div class="stats">
    <div>Заданий: <span id="sTotal">0</span></div>
    <div>Верно: <span id="sCorrect">0</span></div>
    <div>Процент: <span id="sPct">0%</span></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var svg = document.getElementById('board');
  var curve = document.getElementById('curve');
  var ptC = document.getElementById('ptC');
  var grid = document.getElementById('grid');
  var result = document.getElementById('result');
  var btnAnswer = document.getElementById('btnAnswer');
  var btnNew = document.getElementById('btnNew');

  var sTotal = document.getElementById('sTotal');
  var sCorrect = document.getElementById('sCorrect');
  var sPct = document.getElementById('sPct');

  // Система координат внутри viewBox 400x340
  var CX = 200, CY = 220;
  // Масштаб: 1 единица = 30px (по X и Y одинаково)
  var S = 30;

  var current = null;       // { a, b, c, D }
  var answered = false;
  var total = 0, correct = 0;
  var selected = { a: null, c: null, D: null };

  function rnd(min, max){
    return min + Math.floor(Math.random()*(max-min+1));
  }

  // Генерируем параболу с заданным знаком D (по возможности)
  function makeTask(){
    for (var attempt = 0; attempt < 200; attempt++){
      var a = (rnd(0,1) ? 1 : -1) * rnd(1, 3);          // a = ±1, ±2, ±3
      var c = rnd(-2, 3);                                // c = -2..3 (включая 0)
      // b подбираем так, чтобы D = b² - 4ac был разнообразным
      var b = rnd(-3, 3);
      var D = b*b - 4*a*c;
      // Требуем: парабола должна быть видна в кадре — вершина не слишком далеко
      var vx = -b / (2*a);
      var vy = (4*a*c - b*b) / (4*a);
      if (Math.abs(vx) > 4) continue;
      if (vy < -4 || vy > 5) continue;
      // Хотим по возможности все три случая D: >0, =0, <0
      // — не фильтруем специально, просто принимаем как есть
      return { a:a, b:b, c:c, D:D };
    }
    // запасной вариант
    return { a:1, b:0, c:-1, D:4 };
  }

  // y = ax² + bx + c → пиксели
  function toPx(x, y){
    return { px: CX + S*x, py: CY - S*y };
  }

  function buildGrid(){
    while (grid.firstChild) grid.removeChild(grid.firstChild);
    var NS = 'http://www.w3.org/2000/svg';
    var i, l;
    for (i = -6; i <= 6; i++){
      var x = CX + i*S;
      if (x < 10 || x > 395) continue;
      l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', x); l.setAttribute('y1', 10);
      l.setAttribute('x2', x); l.setAttribute('y2', 335);
      grid.appendChild(l);
    }
    for (i = -6; i <= 6; i++){
      var y = CY + i*S;
      if (y < 10 || y > 335) continue;
      l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', 10); l.setAttribute('y1', y);
      l.setAttribute('x2', 395); l.setAttribute('y2', y);
      grid.appendChild(l);
    }
  }

  function buildCurve(a, b, c){
    var segs = [];
    var cur = [];
    var step = 0.05;
    for (var x = -8; x <= 8; x += step){
      var y = a*x*x + b*x + c;
      var p = toPx(x, y);
      var inside = p.px >= 5 && p.px <= 400 && p.py >= 5 && p.py <= 340;
      if (inside){
        cur.push(p);
      } else {
        if (cur.length >= 2) segs.push(cur);
        cur = [];
      }
    }
    if (cur.length >= 2) segs.push(cur);
    var path = '';
    for (var i = 0; i < segs.length; i++){
      var s = segs[i];
      path += 'M ' + s[0].px.toFixed(1) + ' ' + s[0].py.toFixed(1);
      for (var j = 1; j < s.length; j++){
        path += ' L ' + s[j].px.toFixed(1) + ' ' + s[j].py.toFixed(1);
      }
    }
    return path;
  }

  function signOf(v){
    if (Math.abs(v) < 1e-9) return 'zero';
    return v > 0 ? 'pos' : 'neg';
  }

  function clearSelection(){
    selected = { a: null, c: null, D: null };
    document.querySelectorAll('.opt').forEach(function(el){
      el.classList.remove('sel', 'correct', 'wrong');
    });
  }

  function newTask(){
    current = makeTask();
    answered = false;
    clearSelection();
    result.textContent = '';
    result.className = '';
    btnAnswer.disabled = false;

    buildGrid();
    curve.setAttribute('d', buildCurve(current.a, current.b, current.c));

    // Точка (0; c) на оси Oy
    var cp = toPx(0, current.c);
    // Показываем её всегда — это ключ к c
    ptC.setAttribute('cx', cp.px);
    ptC.setAttribute('cy', cp.py);
  }

  // Клик по варианту ответа
  document.querySelectorAll('.opts').forEach(function(group){
    var key = group.getAttribute('data-key');   // 'a' | 'c' | 'D'
    group.querySelectorAll('.opt').forEach(function(opt){
      opt.addEventListener('click', function(){
        if (answered) return;
        // снять выделение у соседей
        group.querySelectorAll('.opt').forEach(function(o){
          o.classList.remove('sel');
        });
        opt.classList.add('sel');
        selected[key] = opt.getAttribute('data-val');
      });
    });
  });

  function checkAnswer(){
    if (answered) return;
    if (!selected.a || !selected.c || !selected.D){
      result.className = 'err';
      result.textContent = 'Отметьте вариант для каждого из a, c, D';
      return;
    }
    answered = true;
    btnAnswer.disabled = true;

    var rightA = signOf(current.a);
    var rightC = signOf(current.c);
    var rightD = signOf(current.D);
    var truth = { a:rightA, c:rightC, D:rightD };
    var allOk = true;

    document.querySelectorAll('.opts').forEach(function(group){
      var key = group.getAttribute('data-key');
      var chosen = selected[key];
      var isRight = (chosen === truth[key]);
      if (!isRight) allOk = false;
      group.querySelectorAll('.opt').forEach(function(o){
        if (o.getAttribute('data-val') === chosen){
          o.classList.remove('sel');
          o.classList.add(isRight ? 'correct' : 'wrong');
        }
        if (!isRight && o.getAttribute('data-val') === truth[key]){
          o.classList.add('correct');
        }
      });
    });

    total++;
        var sign1 = (allOk ? '✓ Верно! ' : '✗ Правильно: ');
    var line1 = sign1 + 'a ' + expr(rightA) +
                ', c ' + expr(rightC) + ', D ' + expr(rightD);
    var line2 = 'y = ' + formatEq(current.a, current.b, current.c);
    if (allOk){
      correct++;
      result.className = 'ok';
    } else {
      result.className = 'err';
    }
    result.innerHTML = line1 + '<br><span class="eq">' + line2 + '</span>';

    sTotal.textContent = total;
    sCorrect.textContent = correct;
    sPct.textContent = total ? Math.round(correct*100/total) + '%' : '0%';
  }
  function formatEq(a, b, c){
    var s = '';
    // ax²
    if (a === 1) s += 'x²';
    else if (a === -1) s += '−x²';
    else s += a + 'x²';
    // bx
    if (b !== 0){
      s += (b > 0 ? ' + ' : ' − ') + (Math.abs(b) === 1 ? '' : Math.abs(b)) + 'x';
    }
    // c
    if (c !== 0){
      s += (c > 0 ? ' + ' : ' − ') + Math.abs(c);
    }
    return s;
  }
  function expr(sign){
    if (sign === 'pos') return '> 0';
    if (sign === 'neg') return '< 0';
    return '= 0';
  }

  btnAnswer.addEventListener('click', checkAnswer);
  btnNew.addEventListener('click', newTask);

  newTask();
})();
</script>
</body>
</html>
